plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.30'
    id 'org.spongepowered.mixin' version '0.7.38'
}

def minecraft_version = addon_minecraft_version
def minecraft_version_range = addon_minecraft_version_range
def forge_version = addon_forge_version
def forge_version_range = addon_forge_version_range
def loader_version_range = addon_loader_version_range
def mapping_channel = addon_mapping_channel
def mapping_version = addon_mapping_version
def mod_id = addon_mod_id
def mod_name = addon_mod_name
def mod_license = addon_mod_license
def mod_version = addon_mod_version
def mod_group_id = addon_mod_group_id
def mod_authors = addon_mod_authors
def mod_description = addon_mod_description
def dragonminezVersion = findProperty('dragonminez_version') ?: '2.1.3'
def dragonminezCurseProject = findProperty('dragonminez_curse_project') ?: '1136088'
def dragonminezCurseFile = findProperty('dragonminez_curse_file') ?: '8469416'
def dragonminezLocalJar = file("libs/dragonminez-${dragonminezVersion}.jar")

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            jvmArg '-Djavax.net.ssl.trustStoreType=Windows-ROOT'
            property 'geckolib.disable_examples', 'true'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    flatDir { dirs 'libs' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    if (dragonminezLocalJar.isFile()) {
        implementation fg.deobf("local:dragonminez:${dragonminezVersion}")
    } else {
        implementation fg.deobf("curse.maven:dragonminez-${dragonminezCurseProject}:${dragonminezCurseFile}")
    }

    runtimeOnly fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.3')
    runtimeOnly 'com.eliotlash.mclib:mclib:20'
    runtimeOnly fg.deobf('com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.10')
    runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    compileOnly fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.3')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    from('src/main/resources/assets/dragonminez/textures/entity/races/alien/bodytype_0_layer1.png') {
        into 'assets/dragonminez/textures/entity/races/alien'
        rename { 'alien_0_layer1.png' }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
