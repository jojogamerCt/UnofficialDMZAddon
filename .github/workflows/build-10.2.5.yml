name: Build Unofficial DMZ Addon 10.2.5

on:
  push:
    branches:
      - agent/10.2.5-player-fixes
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pinned DragonMineZ child project
        run: |
          rm -rf dragonminez
          git clone https://github.com/DragonMineZ/dragonminez.git dragonminez
          git -C dragonminez checkout 685b010269ba45ca736342ab7a60dddb0758181f
          rm -rf dragonminez/.git

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply 10.2.5 changes when needed
        run: |
          if grep -q '^addon_mod_version=10.2.4$' gradle.properties; then
            python3 .github/scripts/apply_10_2_5.py
          fi

      - name: Validate changed files
        run: |
          python3 -m json.tool src/main/resources/unofficialdmzaddon.mixins.json >/dev/null
          python3 -m json.tool src/main/resources/assets/dragonminez/lang/en_us.json >/dev/null
          git diff --check

      - name: Commit release implementation
        if: github.event_name == 'push'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Release implementation already committed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement 10.2.5 player-requested fixes [10.2.5 applied]"
          git push origin HEAD:agent/10.2.5-player-fixes

      - name: Download verified Forge userdev archive
        run: |
          FORGE_VERSION='1.20.1-47.4.10'
          BASE="https://mirror.sjtu.edu.cn/bmclapi/net/minecraftforge/forge/${FORGE_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors \
            "$BASE/forge-${FORGE_VERSION}-userdev.jar" \
            --output /tmp/forge-userdev.jar
          curl --fail --location --retry 5 --retry-all-errors \
            "$BASE/forge-${FORGE_VERSION}-userdev.jar.sha1" \
            --output /tmp/forge-userdev.jar.sha1
          echo "$(tr -d '\r\n' </tmp/forge-userdev.jar.sha1)  /tmp/forge-userdev.jar" | sha1sum --check
          unzip -t /tmp/forge-userdev.jar
          ls -lh /tmp/forge-userdev.jar

      - name: Build addon JAR
        run: |
          chmod +x gradlew

          echo 'Priming ForgeGradle cache; the upstream userdev response may be malformed.'
          ./gradlew help --no-daemon --stacktrace --refresh-dependencies || true

          mapfile -t cached_userdevs < <(
            find "$HOME/.gradle/caches" -type f \
              -name 'forge-1.20.1-47.4.10-userdev.jar' -print
          )
          if [ "${#cached_userdevs[@]}" -eq 0 ]; then
            echo 'ForgeGradle did not create a userdev cache entry.' >&2
            find "$HOME/.gradle/caches" -type f -iname '*47.4.10*' -print || true
            exit 1
          fi

          for cached in "${cached_userdevs[@]}"; do
            echo "Replacing malformed cached archive: $cached"
            cp /tmp/forge-userdev.jar "$cached"
            unzip -t "$cached" >/dev/null
          done

          ./gradlew clean build --offline --no-daemon --stacktrace

      - name: Package Gradle project
        run: |
          mkdir -p release /tmp/unofficialdmzaddon-project/UnofficialDMZAddon-10.2.5
          cp build/libs/*.jar release/
          rsync -a ./ /tmp/unofficialdmzaddon-project/UnofficialDMZAddon-10.2.5/ \
            --exclude='.git/' \
            --exclude='.gradle/' \
            --exclude='build/' \
            --exclude='*/build/' \
            --exclude='release/'
          cd /tmp/unofficialdmzaddon-project
          zip -qr "$GITHUB_WORKSPACE/release/UnofficialDMZAddon-10.2.5-gradle-project.zip" UnofficialDMZAddon-10.2.5
          cd "$GITHUB_WORKSPACE"
          ls -lah release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: UnofficialDMZAddon-10.2.5-release
          path: release/*
          if-no-files-found: error
          retention-days: 30
