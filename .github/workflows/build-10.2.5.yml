name: Build Unofficial DMZ Addon 10.2.5

on:
  push:
    branches:
      - agent/10.2.5-player-fixes
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply 10.2.5 changes when needed
        run: |
          if grep -q '^addon_mod_version=10.2.4$' gradle.properties; then
            python3 .github/scripts/apply_10_2_5.py
          fi

      - name: Validate release sources
        run: |
          python3 -m json.tool src/main/resources/unofficialdmzaddon.mixins.json >/dev/null
          python3 -m json.tool src/main/resources/assets/dragonminez/lang/en_us.json >/dev/null
          git diff --check

      - name: Commit release implementation
        if: github.event_name == 'push'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Release implementation already committed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement 10.2.5 player-requested fixes [10.2.5 applied]"
          git push origin HEAD:agent/10.2.5-player-fixes

      - name: Download addon compile dependencies
        run: |
          mkdir -p libs

          download_jar() {
            local output="$1"
            shift
            rm -f "$output"
            for url in "$@"; do
              echo "Trying $url"
              if curl --fail --location --retry 5 --retry-all-errors \
                --connect-timeout 30 --max-time 600 \
                "$url" --output "$output"; then
                if jar tf "$output" >/dev/null 2>&1; then
                  echo "Validated $output"
                  sha256sum "$output"
                  return 0
                fi
              fi
              rm -f "$output"
            done
            echo "Unable to download a valid JAR for $output" >&2
            return 1
          }

          download_jar libs/dragonminez-2.1.3.jar \
            'https://edge.forgecdn.net/files/8469/416/dragonminez-2.1.3.jar' \
            'https://mediafilez.forgecdn.net/files/8469/416/dragonminez-2.1.3.jar'

          download_jar libs/geckolib-forge-1.20.1-4.8.3.jar \
            'https://edge.forgecdn.net/files/7553/267/geckolib-forge-1.20.1-4.8.3.jar' \
            'https://mediafilez.forgecdn.net/files/7553/267/geckolib-forge-1.20.1-4.8.3.jar' \
            'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-forge-1.20.1/4.8.3/geckolib-forge-1.20.1-4.8.3.jar'

      - name: Prepare standalone addon Gradle project
        run: |
          python3 .github/scripts/prepare_standalone_build.py
          grep -q "local:dragonminez:2.1.3" build.gradle
          if grep -q "include 'dragonminez'" settings.gradle; then
            echo 'DragonMineZ child project is still enabled.' >&2
            exit 1
          fi
          git diff --check

      - name: Prepare verified Forge tooling cache
        run: |
          MIRROR='https://mirror.sjtu.edu.cn/bmclapi'
          FORGE_VERSION='1.20.1-47.4.10'
          MCP_VERSIONS=('1.20.1' '1.20.1-20230612.114412')

          FORGE_SOURCE="$GITHUB_WORKSPACE/.verified-forge/forge-${FORGE_VERSION}-userdev.jar"
          FORGE_CACHE="$HOME/.gradle/caches/forge_gradle/maven_downloader/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-userdev.jar"
          mkdir -p "$(dirname "$FORGE_SOURCE")" "$(dirname "$FORGE_CACHE")"

          download_verified() {
            local url="$1"
            local output="$2"
            local checksum_file
            checksum_file="$(mktemp)"
            mkdir -p "$(dirname "$output")"
            curl --fail --location --retry 5 --retry-all-errors "$url" --output "$output"
            curl --fail --location --retry 5 --retry-all-errors "$url.sha1" --output "$checksum_file"
            echo "$(tr -d '\r\n' <"$checksum_file")  $output" | sha1sum --check
            unzip -t "$output" >/dev/null
            rm -f "$checksum_file"
          }

          seed_cache() {
            local source="$1"
            local target="$2"
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
            printf '%s' "$(md5sum "$target" | cut -d' ' -f1)" > "$target.md5"
            unzip -t "$target" >/dev/null
          }

          download_verified \
            "$MIRROR/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-userdev.jar" \
            "$FORGE_SOURCE"
          seed_cache "$FORGE_SOURCE" "$FORGE_CACHE"

          SEEDED_FILES=("$FORGE_CACHE")
          for MCP_VERSION in "${MCP_VERSIONS[@]}"; do
            MCP_SOURCE="$GITHUB_WORKSPACE/.verified-forge/mcp_config-${MCP_VERSION}.zip"
            MCP_CACHE="$HOME/.gradle/caches/forge_gradle/maven_downloader/de/oceanlabs/mcp/mcp_config/${MCP_VERSION}/mcp_config-${MCP_VERSION}.zip"
            download_verified \
              "$MIRROR/de/oceanlabs/mcp/mcp_config/${MCP_VERSION}/mcp_config-${MCP_VERSION}.zip" \
              "$MCP_SOURCE"
            seed_cache "$MCP_SOURCE" "$MCP_CACHE"
            SEEDED_FILES+=("$MCP_CACHE")
          done

          echo "Seeded ForgeGradle cache:"
          sha1sum "${SEEDED_FILES[@]}"

      - name: Build addon JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Package Gradle project
        run: |
          mkdir -p release /tmp/unofficialdmzaddon-project/UnofficialDMZAddon-10.2.5
          cp build/libs/*.jar release/
          rsync -a ./ /tmp/unofficialdmzaddon-project/UnofficialDMZAddon-10.2.5/ \
            --exclude='.git/' \
            --exclude='.gradle/' \
            --exclude='.verified-forge/' \
            --exclude='build/' \
            --exclude='*/build/' \
            --exclude='release/'
          cd /tmp/unofficialdmzaddon-project
          zip -qr "$GITHUB_WORKSPACE/release/UnofficialDMZAddon-10.2.5-gradle-project.zip" UnofficialDMZAddon-10.2.5
          cd "$GITHUB_WORKSPACE"
          ls -lah release

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: UnofficialDMZAddon-10.2.5-release
          path: release/*
          if-no-files-found: error
          retention-days: 30
