name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.build-trigger'
      - '.build-run-id'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)"
          test -n "$JAR"
          mkdir -p /tmp/check
          (cd /tmp/check && jar xf "$GITHUB_WORKSPACE/$JAR" META-INF/mods.toml)
          grep -Eq '^version[[:space:]]*=[[:space:]]*"10\.4\.0"' /tmp/check/META-INF/mods.toml
          grep -Fq 'Unofficial DMZ Addon is an addon for our beloved DragonMine Z that adds new features and mechanics.' /tmp/check/META-INF/mods.toml
          cp "$JAR" UnofficialDMZAddon-10.4.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: UnofficialDMZAddon-10.4.0
          path: UnofficialDMZAddon-10.4.0.jar
          if-no-files-found: error
          compression-level: 0
