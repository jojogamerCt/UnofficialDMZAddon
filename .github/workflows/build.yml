name: Build

on:
  push:
    branches: [ master ]
    paths: [ '.build-trigger' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Record run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .build-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-run-id
          git commit -m "Record build run"
          git push origin HEAD:master
      - name: Apply source change
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_outline_preview.py
          rm -f .github/scripts/apply_outline_preview.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Isolate custom form outline preview"
            git push origin HEAD:master
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)"
          test -n "$JAR"
          mkdir -p /tmp/check
          (cd /tmp/check && jar xf "$GITHUB_WORKSPACE/$JAR" META-INF/mods.toml)
          grep -Eq '^version[[:space:]]*=[[:space:]]*"10\.4\.0"' /tmp/check/META-INF/mods.toml
          grep -Fq 'Unofficial DMZ Addon is an addon for our beloved DragonMine Z that adds new features and mechanics.' /tmp/check/META-INF/mods.toml
          cp "$JAR" UnofficialDMZAddon-10.4.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: UnofficialDMZAddon-10.4.0
          path: UnofficialDMZAddon-10.4.0.jar
          if-no-files-found: error
          compression-level: 0
