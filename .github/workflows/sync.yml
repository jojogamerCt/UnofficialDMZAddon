name: Sync Source

on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/sync.yml' ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fetch source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/15039854869b6b7df5308045ba202d105f38b2e4" \
            -o /tmp/source-blob.json
          jq -r '.content' /tmp/source-blob.json | tr -d '\n' | base64 --decode > /tmp/source.tar.xz
          echo "cd3669e4b74dab2a9aca6879b2b99d8c8769b591481428a2c127c910b1f1bd56  /tmp/source.tar.xz" | sha256sum -c -
      - name: Apply source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/source.tar.xz -C .
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            rm -rf -- "$path"
          done < .sync-delete.txt
          rm -f .sync-delete.txt
          rm -f .github/workflows/sync.yml
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update 10.4.0 build and source"
            git push origin HEAD:master
          fi
